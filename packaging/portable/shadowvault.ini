; Shadow Vault — USB / traveler configuration
; Place this file beside svcli.exe (auto-detected on startup).

[portable]
enabled=1
no_host_traces=0
recent_volumes=0
cache_enabled=0
log_to_file=0

[paths]
vaults_dir=vaults
keyfiles_dir=keyfiles
temp_dir=.shadowvault\temp

[kdf]
profile=portable

[mount]
read_only=0
idle_timeout_sec=300